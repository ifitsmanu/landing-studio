name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts and deterministic evals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm run validate
      - run: npm run test:contracts
      - run: npm run evals
      - run: npm run motion:check

  browser-smoke:
    name: Browser and motion smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm --prefix tools/browser-qa ci
      - run: npm run motion:install
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx --prefix tools/browser-qa playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:motion
      - run: npm run qa:smoke
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-qa-evidence
          path: .landing-studio/evidence/browser-qa-smoke/
          if-no-files-found: ignore
          retention-days: 7
